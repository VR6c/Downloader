name: Web Build & CI Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'TVR Library Organizer/package-lock.json'

      - name: Install dependencies
        run: |
          cd "TVR Library Organizer"
          npm ci

      - name: Build Web Application (Vite)
        env:
          VERCEL: "1"
        run: |
          cd "TVR Library Organizer"
          npm run build

      - name: Verify dist artifacts
        run: |
          test -f "TVR Library Organizer/dist/index.html"
          echo "✅ Web build successfully generated dist/index.html"
